name: Catalogue storage SQL contracts
on:
  push:
    branches: ["integration/supabase-auth-storage"]
  pull_request:
    paths: ["atlas_catalogue_*.py", "tests/test_catalogue*.py", "tests/sql/**", "supabase/migrations/**", ".github/workflows/catalogue-storage.yml"]
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: catalogue-ci-only
          POSTGRES_DB: catalogue_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: catalogue-ci-only
      PGDATABASE: catalogue_ci
    steps:
      - uses: actions/checkout@v4
      - name: Test catalogue and worker migrations in disposable PostgreSQL
        run: >-
          psql -v ON_ERROR_STOP=1
          -f tests/sql/catalogue_bootstrap.sql
          -f supabase/migrations/20261117094355_curriculum_atlas_persistence_foundation.sql
          -f supabase/migrations/20261117150200_catalogue_storage.sql
          -f supabase/migrations/20261117190000_catalogue_worker.sql
          -f tests/sql/catalogue_storage.sql
          -f tests/sql/catalogue_worker.sql
