# Obsolete Flet-to-GitHub-Pages template; the application is hosted on Vercel.
# Manual explanation only. Do not add automatic build or deployment triggers here.
name: 'Retired: Flet Pages template (main.yml)'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explanation:
    name: Explain retired Flet template
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No build or deployment is performed
        shell: bash
        run: |
          echo "::notice::Obsolete Flet/Pages template. No build or deployment is performed."
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Obsolete Flet/Pages workflow retired
          This was a Flet-to-GitHub-Pages template, not the Vercel deployment pipeline.
          It no longer runs automatically on pushes or pull requests.
          This manual explanation does not build, check out, upload, or deploy anything.
          Application code, Vercel configuration, and the existing Python CI are unchanged.
          SUMMARY
