name: Supabase backend tests
on:
  push:
    branches: ["integration/supabase-auth-storage"]
  pull_request:
    paths: ["atlas_supabase.py", "tests/test_supabase_*.py", ".github/workflows/supabase-integration.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q atlas_supabase.py
      - run: python -m unittest discover -s tests -p 'test_supabase_*.py' -v
