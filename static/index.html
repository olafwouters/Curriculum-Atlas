<script id="curriculum-atlas-name">
// Visible application branding only; storage keys and JSON schemas are unchanged.
(() => {
  'use strict';
  const brand = 'Curriculum Atlas';
  const oldName = /(?:Digital\s*&\s*AI[-–\s]*literacy\s+)?Curriculum\s+(?:Compass|Atlas)/gi;
  const rename = text => String(text).replace(oldName, brand);
  let pending = false;
  function sync() {
    pending = false;
    if (document.title !== brand) document.title = brand;
    const logo = document.querySelector('.sidebar-brand');
    if (logo && logo.textContent !== brand) logo.textContent = brand;
    const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walk.nextNode()) nodes.push(walk.currentNode);
    for (const node of nodes) {
      const parent = node.parentElement;
      if (!parent || parent.closest('script,style,textarea,input,pre,code,.source,[contenteditable],[data-user-content]')) continue;
      const next = rename(node.nodeValue);
      if (next !== node.nodeValue) node.nodeValue = next;
    }
    for (const element of document.querySelectorAll('[aria-label],[title]')) {
      for (const attribute of ['aria-label', 'title']) {
        const value = element.getAttribute(attribute);
        if (value !== null && rename(value) !== value) element.setAttribute(attribute, rename(value));
      }
    }
    const originalDownload = window.download;
    if (typeof originalDownload === 'function' && !originalDownload.atlasBranding) {
      function atlasDownload(name, content, type) {
        let filename = String(name || 'export.json').replace(/curriculum[-_ ]compass/gi, 'Curriculum-Atlas');
        if (!/^curriculum[-_ ]atlas(?:[-_. ]|$)/i.test(filename)) filename = 'Curriculum-Atlas-' + filename;
        return originalDownload.call(this, filename, content, type);
      }
      atlasDownload.atlasBranding = true;
      window.download = atlasDownload;
    }
  }
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(sync);
  }
  new MutationObserver(schedule).observe(document.body, {subtree: true, childList: true, characterData: true});
  document.addEventListener('change', schedule);
  sync();
})();
</script>
